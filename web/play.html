<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1d23">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Crawler · The System</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/play.css">
</head>
<body class="play tool-page">

  <!-- Join: room + PIN keypad -->
  <section id="join" class="join tool" hidden>
    <div class="join-head">
      <p class="join-brand">The System</p>
      <h1 class="join-title">Join the game</h1>
      <p class="dim">Type the room code from the TV and the 4-digit PIN your GM gave you.</p>
    </div>
    <label class="room-line">
      <span>Room</span>
      <input id="room-input" class="room-input" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="ABCD">
    </label>
    <div class="pin-dots" id="pin-dots" aria-live="polite" aria-label="PIN entered">
      <span></span><span></span><span></span><span></span>
    </div>
    <p class="join-err" id="join-err" role="alert"></p>
    <div class="keypad" id="keypad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k="clear" class="k-soft" aria-label="Clear">C</button>
      <button type="button" data-k="0">0</button>
      <button type="button" data-k="back" class="k-soft" aria-label="Delete last digit">⌫</button>
    </div>
  </section>

  <!-- Character sheet -->
  <main id="app" class="app tool" hidden>
    <header class="appbar">
      <span class="appbar-brand" id="brand">The System</span>
      <span class="appbar-live" title="Audience watching right now"><span class="live-dot" aria-hidden="true"></span><b id="viewers">0</b> watching</span>
      <span class="grow"></span>
      <button type="button" class="btn btn-quiet btn-sm" id="log-btn" aria-controls="log-rail" aria-expanded="false">Dice log <span class="tab-n" id="log-n"></span></button>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch light or dark"></button>
      <button type="button" class="btn btn-quiet btn-sm" id="leave" title="Leave this device">Leave</button>
    </header>
    <div class="app-cols">
      <div class="app-sheet" id="sheet-root"></div>
      <aside class="log-rail" id="log-rail" aria-label="Dice log"></aside>
    </div>
    <footer class="ticker" aria-label="Latest from the show">
      <div class="ticker-track" id="ticker"></div>
    </footer>
  </main>

  <!-- Full-screen takeover for things that happen to me (the broadcast look stays here) -->
  <div id="takeover" class="takeover" hidden role="dialog" aria-modal="true" aria-live="assertive"></div>

  <!-- Connection state -->
  <div id="reconnect" class="reconnect" hidden>
    <div class="sys" data-head="SYSTEM">
      <p class="sys-title">Signal lost.</p>
      <p class="sys-desc"><span id="reconnect-msg">Reconnecting to the host</span><span class="cursor"></span></p>
      <p class="sys-desc dim small">Your character is safe on the host. Stay on the same Wi-Fi.</p>
    </div>
  </div>

  <script type="module" src="/js/play.js"></script>
</body>
</html>
